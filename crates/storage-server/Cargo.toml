[package]
name = "storage-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "High-throughput zero-copy length-prefixed binary protocol TCP server and client for the storage engine"

[lib]
name = "storage_server"
path = "src/lib.rs"

[[bin]]
name = "storage-server"
path = "src/main.rs"

[dependencies]
