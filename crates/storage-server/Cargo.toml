[package]
name = "storage-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "High-throughput zero-copy length-prefixed binary protocol TCP server and client for the storage engine"

[lib]
name = "storage_server"
path = "src/lib.rs"

[[bin]]
name = "storage-server"
path = "src/main.rs"

[dependencies]
storage-types = { path = "../storage-types" }
storage-codec = { path = "../storage-codec" }
storage-tls = { path = "../storage-tls" }
storage-mmap = { path = "../storage-mmap" }
storage-wal = { path = "../storage-wal" }
storage-index = { path = "../storage-index" }
storage-graph = { path = "../storage-graph" }
storage-core = { path = "../storage-core" }

[features]
# Counts the bytes the server holds allocated and reports them in `OP_HEALTH` (`heap_live`,
# `heap_peak`): RSS beside them tells a growing heap from memory the allocator keeps after use.
# Off by default: every allocation then pays two atomic operations.
heap-stats = []

[lints]
workspace = true
