<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Storine Console</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <button class="icon-btn" id="menu" type="button" aria-label="Show or hide the sidebar" aria-expanded="true" hidden></button>
    <a class="brand" href="#/" aria-label="Storine Console home">
      <img src="/icon.svg" alt="" width="22" height="22">
      <span class="wordmark">Storine</span><span class="product">Console</span>
    </a>
    <div class="conn" id="conn" hidden>
      <span class="dot" id="conn-dot"></span>
      <span class="conn-url" id="conn-url"></span>
      <span class="badge" id="conn-role"></span>
      <span class="conn-latency" id="conn-latency"></span>
    </div>
    <button class="search-trigger" id="palette-open" type="button" hidden aria-label="Search and jump (command palette)"></button>
    <div class="topbar-actions">
      <button class="icon-btn" id="theme" type="button"></button>
      <button class="icon-btn" id="disconnect" type="button" title="Disconnect" aria-label="Disconnect" hidden></button>
    </div>
  </header>
  <div class="layout" id="layout">
    <nav class="sidebar" id="sidebar" hidden aria-label="Navigation">
      <div id="nav-top"></div>
      <div class="nav-section">
        <span>Collections</span>
        <button class="icon-btn small" id="new-collection" type="button" title="New collection" aria-label="New collection"></button>
      </div>
      <label class="nav-search">
        <span class="nav-search-icon" id="nav-search-icon"></span>
        <input id="nav-filter" type="search" placeholder="Filter" aria-label="Filter collections" autocomplete="off" spellcheck="false">
      </label>
      <div class="nav-list" id="nav-list"></div>
      <div id="nav-recent"></div>
      <div class="nav-foot">
        <button class="nav-help" id="shortcuts" type="button"><span>Keyboard shortcuts</span><kbd>?</kbd></button>
      </div>
    </nav>
    <div class="scrim" id="scrim" hidden></div>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <aside class="drawer" id="drawer" hidden aria-label="Document"></aside>
  <dialog class="palette" id="palette" aria-label="Command palette"></dialog>
  <dialog class="modal" id="modal"></dialog>
  <div class="toast-host" id="toasts" aria-live="polite"></div>
  <noscript><p class="noscript">The Storine console needs JavaScript.</p></noscript>
</body>
</html>
