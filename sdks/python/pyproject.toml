[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "storine"
version = "0.1.0"
description = "Python client for the Storine database (documents, exact decimals, atomic updates, clusters)"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[tool.setuptools]
packages = ["storine"]
