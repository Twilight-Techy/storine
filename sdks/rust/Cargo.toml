[package]
name = "storine"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
description = "Client for the Storine database. No dependencies."
license = "MIT OR Apache-2.0"
repository = "https://github.com/twilight-techy/storine"
readme = "README.md"

# Standalone crate: not a member of the engine workspace.
[workspace]

[dependencies]
# TLS 1.3 for `storines://` (off by default, so the default build has no dependencies). It is
# the engine's own zero-dependency TLS (`crates/storage-tls`) and needs Rust 1.82.
storage-tls = { path = "../../crates/storage-tls", optional = true }

[features]
tls = ["dep:storage-tls"]
