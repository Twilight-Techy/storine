# Lint and test on every push and pull request: Linux on x86_64 and arm64 (the checksum and
# SIMD paths differ by architecture), macOS on arm64 (kqueue reactor) and Windows on x86_64
# (AFD-poll reactor, Win32 file mapping). The long soaks (`process_chaos soak_*`, ignored by default)
# are run by hand: see docs/RELEASE.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.99.1"

jobs:
  test:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - name: Toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal -c clippy
          rustup default "$RUST_TOOLCHAIN"
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests
        run: cargo test --release --workspace --no-fail-fast
      # The ceilings apply to what ships: the release build for the baseline CPU
      # (tools/release/build-dist.sh), not this runner's `native` build, which AVX-512
      # makes about 25% larger.
      - name: Binary size (RULE-MEM-03)
        if: matrix.os == 'ubuntu-24.04'
        env:
          RUSTFLAGS: "-C target-cpu=x86-64"
          CARGO_TARGET_DIR: target-dist
        run: |
          cargo build --release --bins -p storage-server -p storage-cli -p storage-sql -p storage-console
          fail=0
          for spec in storage-server:5767168 storage-cli:1835008 storine-sql:8388608 storine-console:1048576; do
            bin=${spec%%:*}; max=${spec##*:}
            size=$(stat -c %s "target-dist/release/$bin")
            echo "$bin: $size bytes (ceiling $max)"
            [ "$size" -lt "$max" ] || { echo "::error::$bin is $size bytes, over its $max-byte ceiling"; fail=1; }
          done
          exit $fail

  # The install scripts (tools/install) against the latest published release, on each system
  # they support. The release workflow runs them again on the version it publishes.
  installers:
    name: installers ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: tools/install
      - name: install.sh
        if: runner.os != 'Windows'
        shell: bash
        run: |
          STORINE_INSTALL_DIR="$RUNNER_TEMP/storine" sh tools/install/install.sh
          "$RUNNER_TEMP/storine/storine-console" --help | grep -q "web console"
          "$RUNNER_TEMP/storine/storage-server" gen-ca "$RUNNER_TEMP/ca" > /dev/null
      - name: install.ps1 in Windows PowerShell 5.1 (what `irm | iex` runs in by default)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $env:STORINE_INSTALL_DIR = "$env:RUNNER_TEMP\storine51"
          ./tools/install/install.ps1
          if (-not (Test-Path "$env:RUNNER_TEMP\storine51\storage-server.exe")) { throw 'not installed' }
      - name: install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STORINE_INSTALL_DIR = "$env:RUNNER_TEMP\storine"
          ./tools/install/install.ps1
          $help = & "$env:RUNNER_TEMP\storine\storine-console.exe" --help | Out-String
          if ($help -notmatch 'web console') { throw "storine-console --help: $help" }
          & "$env:RUNNER_TEMP\storine\storage-server.exe" gen-ca "$env:RUNNER_TEMP\ca"
          if ($LASTEXITCODE -ne 0) { throw "storage-server gen-ca failed" }
          # The installer put the directory on the user's PATH for new terminals.
          if (([Environment]::GetEnvironmentVariable('Path', 'User') -split ';') -notcontains "$env:RUNNER_TEMP\storine") { throw 'not on the user PATH' }
